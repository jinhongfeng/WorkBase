appId: com.workbase.app
productName: WorkBase
copyright: Copyright © 2026 WorkBase
directories:
  output: release
  buildResources: resources
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  - resources/icon.ico
extraResources:
  - from: src/main/db/migrations
    to: migrations
  - from: browser-extension
    to: browser-extension
  - from: dist/vault-host
    to: vault-host
asar: true
electronDist: node_modules/electron/dist
asarUnpack:
  - node_modules/**/better-sqlite3/**/*.node
  - node_modules/imapflow/**
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: WorkBase-Setup-${version}.${ext}
portable:
  artifactName: WorkBase-Portable-${version}.${ext}
